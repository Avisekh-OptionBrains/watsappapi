name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Dashboard scripts parse
        run: for f in public/admin/*.js; do node --check "$f"; done
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: check
    # Turn on with the repository variable DEPLOY_ENABLED=true once the Cloudflare secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_WORKER_SECRETS: ${{ secrets.WORKER_SECRETS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Database migrations
        run: npx wrangler d1 migrations apply wa-gateway --remote

      - name: Worker secrets
        # Optional: the whole .prod.vars file stored as the WORKER_SECRETS secret.
        if: env.HAS_WORKER_SECRETS == 'true'
        env:
          WORKER_SECRETS: ${{ secrets.WORKER_SECRETS }}
        run: |
          printf '%s\n' "$WORKER_SECRETS" > "$RUNNER_TEMP/worker.vars"
          npx wrangler secret bulk "$RUNNER_TEMP/worker.vars"
          rm -f "$RUNNER_TEMP/worker.vars"

      - name: Deploy
        run: npx wrangler deploy

      - name: Health check
        if: vars.GATEWAY_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${{ vars.GATEWAY_URL }}/health") && break
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"warnings":\[\]' || echo "::warning::Gateway health has warnings: $body"
