# Production overlay. Only Caddy is published (80/443).
# Postgres, Redis, Typebot, and the gateway stay on the Docker network.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Set WA_HOST, TYPEBOT_HOST, VIEWER_HOST, NEXTAUTH_URL, NEXT_PUBLIC_VIEWER_URL,
# TYPEBOT_DATABASE_URL, OB_RESEARCH_API_URL, and OB_RESEARCH_WEBHOOK_URL in .env first.
# TYPEBOT_DATABASE_URL is an external Postgres URL, so this file does not start Postgres.

services:
  postgres:
    profiles: ["bundled-db"]
    ports: !reset []

  redis:
    ports: !reset []

  evolution-api:
    ports: !reset []

  typebot-builder:
    ports: !reset []
    depends_on: !reset []
    environment:
      DATABASE_URL: ${TYPEBOT_DATABASE_URL:?set TYPEBOT_DATABASE_URL to the external Postgres URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to the public builder URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:?set NEXT_PUBLIC_VIEWER_URL to the public viewer URL}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}

  typebot-viewer:
    ports: !reset []
    depends_on: !override
      typebot-builder:
        condition: service_started
    environment:
      DATABASE_URL: ${TYPEBOT_DATABASE_URL:?set TYPEBOT_DATABASE_URL to the external Postgres URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to the public builder URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:?set NEXT_PUBLIC_VIEWER_URL to the public viewer URL}

  gateway:
    ports: !reset []
    extra_hosts: !reset []
    environment:
      OB_RESEARCH_API_URL: ${OB_RESEARCH_API_URL:?set OB_RESEARCH_API_URL to the public site}
      OB_RESEARCH_WEBHOOK_URL: ${OB_RESEARCH_WEBHOOK_URL:?set OB_RESEARCH_WEBHOOK_URL}

  cloudflared:
    profiles: ["tunnel"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      typebot-builder:
        condition: service_started
      typebot-viewer:
        condition: service_started
    environment:
      WA_HOST: ${WA_HOST:?set WA_HOST}
      TYPEBOT_HOST: ${TYPEBOT_HOST:?set TYPEBOT_HOST}
      VIEWER_HOST: ${VIEWER_HOST:?set VIEWER_HOST}
      ACME_EMAIL: ${ACME_EMAIL:-admin@optionbrains.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
