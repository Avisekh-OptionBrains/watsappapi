services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-watsapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watsapp} -d ${POSTGRES_DB:-watsapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    profiles: ["evolution"]
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?set AUTHENTICATION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: optionbrains_wa
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      TYPEBOT_ENABLED: ${TYPEBOT_ENABLED:-true}
      TYPEBOT_API_VERSION: ${TYPEBOT_API_VERSION:-latest}
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK:?set WA_BUSINESS_TOKEN_WEBHOOK}
      WA_BUSINESS_URL: https://graph.facebook.com
      WA_BUSINESS_VERSION: ${WA_BUSINESS_VERSION:-v21.0}
      WA_BUSINESS_LANGUAGE: en_US
      WEBHOOK_GLOBAL_ENABLED: ${WEBHOOK_GLOBAL_ENABLED:-true}
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_GLOBAL_URL:-http://gateway:3100/webhooks/evolution}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_TYPEBOT_START: "true"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "true"
      CORS_ORIGIN: "*"
      LOG_LEVEL: ERROR,WARN,INFO
      LANGUAGE: en
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${TYPEBOT_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=typebot}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:?set TYPEBOT_ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:3002}
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL:-admin@optionbrains.com}
      SMTP_AUTH_DISABLED: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      NEXT_PUBLIC_SMTP_FROM: ${SMTP_FROM:-OptionBrains <noreply@optionbrains.com>}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      DEFAULT_WORKSPACE_PLAN: UNLIMITED

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      typebot-builder:
        condition: service_started
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: ${TYPEBOT_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=typebot}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET:?set TYPEBOT_ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:3002}
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL:-admin@optionbrains.com}
      SMTP_AUTH_DISABLED: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      NEXT_PUBLIC_SMTP_FROM: ${SMTP_FROM:-OptionBrains <noreply@optionbrains.com>}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      typebot-viewer:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3100
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      # Always use Docker DNS inside the compose network (host .env may say localhost)
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-optionbrains}
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-otp_code}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en_US}
      WHATSAPP_INCLUDE_OTP_BUTTON: ${WHATSAPP_INCLUDE_OTP_BUTTON:-1}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v21.0}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK:?set WA_BUSINESS_TOKEN_WEBHOOK}
      TYPEBOT_VIEWER_URL: http://typebot-viewer:3000
      TYPEBOT_API_URL: http://typebot-viewer:3000
      TYPEBOT_PUBLIC_ID: ${TYPEBOT_PUBLIC_ID:-ob-support}
      TYPEBOT_BRIDGE_ENABLED: ${TYPEBOT_BRIDGE_ENABLED:-1}
      # Product chatbot menus — keep 0 in production until go-live (OTP still works)
      WHATSAPP_PRODUCT_BOT_ENABLED: ${WHATSAPP_PRODUCT_BOT_ENABLED:-0}
      CAMPAIGN_SEND_DELAY_MS: ${CAMPAIGN_SEND_DELAY_MS:-1200}
      CAMPAIGN_REQUIRE_OPT_IN: ${CAMPAIGN_REQUIRE_OPT_IN:-1}
      CAMPAIGN_MAX_RECIPIENTS: ${CAMPAIGN_MAX_RECIPIENTS:-5000}
      OB_RESEARCH_WEBHOOK_URL: ${OB_RESEARCH_WEBHOOK_URL:-}
      OB_RESEARCH_WEBHOOK_SECRET: ${OB_RESEARCH_WEBHOOK_SECRET:-}
      # ob-research Next.js on the host (Windows/Mac Docker Desktop)
      OB_RESEARCH_API_URL: ${OB_RESEARCH_API_URL:-http://host.docker.internal:3000}
      OB_RESEARCH_BOT_KEY: ${OB_RESEARCH_BOT_KEY:-${SERVICE_API_KEY}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional quick tunnel. Not started unless you pass --profile tunnel.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:3100
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
